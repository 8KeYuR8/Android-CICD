  distribute:
    name: Distribute to Firebase
    needs: static-code-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Set version environment
        run: echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: |
          yes | sdkmanager "build-tools;34.0.0"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > keystore.jks

      - name: Build APK & AAB
        run: VERSION_CODE=${{ github.run_number }} ./gradlew assembleRelease bundleRelease

      - name: Align APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          app-release-aligned.apk

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks keystore.jks \
          --ks-key-alias "${{ secrets.ANDROID_DEVS_ALIAS }}" \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --key-pass pass:${{ secrets.ANDROID_DEVS_ALIAS_PASSWORD }} \
          --out app-release.apk \
          app-release-aligned.apk

      - name: Sign AAB
        run: |
          jarsigner \
          -keystore keystore.jks \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.ANDROID_DEVS_ALIAS_PASSWORD }}" \
          app/build/outputs/bundle/release/app-release.aab \
          "${{ secrets.ANDROID_DEVS_ALIAS }}"

      - name: Cleanup keystore
        run: rm -f keystore.jks

      - name: Upload artifacts (APK + AAB)
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app/build/outputs/apk/release/app-release.apk

